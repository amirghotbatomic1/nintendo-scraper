name: YouTube Video Sync Worker

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js (for AbreHamrahi Uploader)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Deno (JavaScript Runtime for YouTube Solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Sync Worker
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SYNC_API_TOKEN: ${{ secrets.SYNC_API_TOKEN }}
          ABREHAMRAHI_REFRESH_TOKEN: ${{ secrets.ABREHAMRAHI_REFRESH_TOKEN }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python worker.py
