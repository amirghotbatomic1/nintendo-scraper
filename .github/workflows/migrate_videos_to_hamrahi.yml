name: 🎬 Migrate Existing Videos to AbreHamrahi Cloud (Temporary)

on:
  workflow_dispatch:
    inputs:
      target_folder:
        description: 'Target Folder on AbreHamrahi Cloud'
        required: false
        default: 'Videos'
        type: string

jobs:
  migrate-videos:
    name: 🚀 Migrate Videos to AbreHamrahi & Update Database
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Video Migration Script
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SYNC_API_TOKEN: ${{ secrets.SYNC_API_TOKEN }}
          ABREHAMRAHI_REFRESH_TOKEN: ${{ secrets.ABREHAMRAHI_REFRESH_TOKEN }}
        run: |
          if [ -d "scripts/youtube-downloader" ]; then
            cd scripts/youtube-downloader
          fi
          node migrate_videos.cjs --folder "${{ github.event.inputs.target_folder || 'Videos' }}"

      - name: Display Summary
        if: always()
        run: |
          echo "### 🎬 فرآیند انتقال ویدیوهای هاست به ابر همراهی به پایان رسید!" >> $GITHUB_STEP_SUMMARY
          echo "- **زمان اجرا:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **وضعیت:** ویدیوها در ابر همراهی آپلود و دیتابیس سایت بروزرسانی شد." >> $GITHUB_STEP_SUMMARY
