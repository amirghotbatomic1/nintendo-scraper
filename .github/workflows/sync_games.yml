name: 🎮 Switch Games to AbreHamrahi Sync Worker

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      batch_games:
        description: 'Multi-Game Batch (TARGET_SITE: your-site-url \n PAGE: rom-page-url \n BASE: direct-url \n separated by ---)'
        required: false
        type: string
      target_site_url:
        description: 'Site Game Page URL to Update (e.g. https://your-site.com/downloads/mario-odyssey - Replaces existing links with new ones)'
        required: false
        type: string
      single_url:
        description: 'Source Game Page URL (NSWPedia / Switch-Romz - Leave empty if using batch_games)'
        required: false
        type: string
      direct_base_url:
        description: 'Base Game Direct Download Link (For single game)'
        required: false
        type: string
      direct_update_url:
        description: 'Update Direct Download Link (For single game)'
        required: false
        type: string
      direct_dlc_url:
        description: 'DLC Direct Download Link (For single game)'
        required: false
        type: string

jobs:
  sync-games:
    name: 🚀 Download Switch ROM & Upload to AbreHamrahi
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 🧹 Free Disk Space (Maximize Runner Space ~70GB+)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install High-Speed Download & Packaging Tools (Aria2, RAR, Zip, 7z)
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 rar unrar p7zip-full zip unzip

      - name: ⚡ Execute NSWPedia Sync Pipeline
        id: sync_step
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          SYNC_API_TOKEN: ${{ secrets.SYNC_API_TOKEN || vars.SYNC_API_TOKEN }}
          ABREHAMRAHI_REFRESH_TOKEN: ${{ secrets.ABREHAMRAHI_REFRESH_TOKEN }}
          ZIP_PASSWORD: ${{ vars.ZIP_PASSWORD || secrets.ZIP_PASSWORD }}
          RAW_BATCH_INPUT: ${{ github.event.inputs.batch_games }}
        run: |
          CMD="node sync_games.cjs"

          if [ -n "$RAW_BATCH_INPUT" ]; then
            printf "%s\n" "$RAW_BATCH_INPUT" > batch_games.txt
            echo "📋 Batch definition file created with contents:"
            cat batch_games.txt
            CMD="$CMD --batch-file batch_games.txt"
          fi

          if [ -n "${{ github.event.inputs.target_site_url }}" ]; then
            CMD="$CMD --target-site-url \"${{ github.event.inputs.target_site_url }}\""
          fi

          if [ -n "${{ github.event.inputs.single_url }}" ]; then
            CMD="$CMD --single-url \"${{ github.event.inputs.single_url }}\""
          fi

          if [ -n "${{ github.event.inputs.direct_base_url }}" ]; then
            CMD="$CMD --direct-base-url \"${{ github.event.inputs.direct_base_url }}\""
          fi

          if [ -n "${{ github.event.inputs.direct_update_url }}" ]; then
            CMD="$CMD --direct-update-url \"${{ github.event.inputs.direct_update_url }}\""
          fi

          if [ -n "${{ github.event.inputs.direct_dlc_url }}" ]; then
            CMD="$CMD --direct-dlc-url \"${{ github.event.inputs.direct_dlc_url }}\""
          fi

          echo "🚀 Executing pipeline..."
          eval $CMD

      - name: 📋 Display Summary
        if: always()
        run: |
          echo "### 🎮 انتقال بازی نینتندو سوییچ به ابر همراهی انجام شد!" >> $GITHUB_STEP_SUMMARY
          echo "- **زمان اجرا:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **وضعیت:** با موفقیت پردازش شد و لینک‌ها به سایت ارسال گردید." >> $GITHUB_STEP_SUMMARY
